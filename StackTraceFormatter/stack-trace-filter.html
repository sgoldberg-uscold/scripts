<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Trace Filter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            min-height: 400px;
        }
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .controls {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Stack Trace Filter</h1>
    <div class="controls">
        <label for="filter">Filter term (e.g., com.uscs):</label>
        <input type="text" id="filter" value="com.uscs" placeholder="Enter package name or term">
        <button onclick="filterStackTrace()">Filter</button>
        <button onclick="copyOutput()">Copy Filtered Output</button>
    </div>
    
    <div class="container">
        <div class="panel">
            <label for="input">Paste Stack Trace:</label>
            <textarea id="input" placeholder="Paste your stack trace here..."></textarea>
        </div>
        <div class="panel">
            <label for="output">Filtered Output:</label>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <script>
        function filterStackTrace() {
            const input = document.getElementById('input').value;
            const filter = document.getElementById('filter').value.trim();
            const output = document.getElementById('output');
            
            if (!filter) {
                alert('Please enter a filter term');
                return;
            }
            
            const lines = input.split('\n');
            const filtered = [];
            let lastWasEllipsis = false;
            
            for (let line of lines) {
                if (line.includes(filter)) {
                    filtered.push(line);
                    lastWasEllipsis = false;
                } else if (line.trim() !== '') {
                    if (!lastWasEllipsis) {
                        filtered.push('    ...');
                        lastWasEllipsis = true;
                    }
                } else {
                    // Preserve empty lines
                    filtered.push(line);
                    lastWasEllipsis = false;
                }
            }
            
            output.value = filtered.join('\n');
        }
        
        function copyOutput() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }
        
        // Auto-filter when Enter is pressed in the filter input
        document.getElementById('filter').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                filterStackTrace();
            }
        });
        
        // Auto-filter when input changes (optional)
        document.getElementById('input').addEventListener('input', function() {
            if (this.value && document.getElementById('filter').value) {
                filterStackTrace();
            }
        });
    </script>
</body>
</html>
